<!DOCTYPE html>
<!-- ============================================================
  eslite-aigc.html — 誠品外殼頁（Layer 1，AIGC 深度解析）
  用途：誠品網站中的 iframe 外殼，內嵌遠見 GTM 中介頁 gvm-aigc.html。
        本頁無法控制（由誠品工程師維護），僅負責版型與高度監聽。

  3-Layer 架構：
    [Layer 1] eslite-aigc.html（本頁，誠品）
      └─ iframe → [Layer 2] gvm-aigc.html（遠見，含 GTM-5ZH7TSVB）
                    └─ iframe → [Layer 3] aigc.html（摩速，postMessage 傳事件）

  GTM：無（GA4 追蹤由 Layer 2 gvm-aigc.html 負責）
  postMessage：接收 iframeHeight 以自動撐高 #contentFrame
  ============================================================ -->
<html lang="zh-TW">
<head>
<!-- ─── Meta / Charset ─── -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>深度解析 — 誠品線上</title>
<!-- ─── Google Fonts ─── -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:ital,wght@0,300;0,400;0,500;0,600;0,700&family=Noto+Sans+TC:ital,wght@0,300;0,400;0,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<!-- ─── Styles ─── -->
<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
* { font-style: normal; font-synthesis: none; }

/* ── CSS Variables（全域色彩系統）── */
:root {
  --white: #FFFFFF;
  --off-white: #F9F7F4;
  --rule-light: #E8E4DC;
  --rule: #D4CEC4;
  --text-hint: #AFA9A0;
  --text-muted: #847E76;
  --text-body: #3D3830;
  --text-head: #1A1710;
  --transition: 0.2s ease;
}

body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--white);
  color: var(--text-body);
  -webkit-font-smoothing: antialiased;
}

/* ── 頁面容器 ── */
.shell {
  max-width: 800px;
  margin: 0 auto;
  padding: 0 32px;
}

/* ── Navbar ── */
.navbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 52px;
  border-bottom: 1px solid var(--text-head);
}
.navbar-left { display: flex; align-items: center; gap: 20px; }
.navbar-brand {
  font-family: 'EB Garamond', serif;
  font-size: 14px;
  letter-spacing: 0.14em;
  color: var(--text-head);
  text-transform: uppercase;
  text-decoration: none;
}
.navbar-divider { width: 1px; height: 12px; background: var(--rule); }
.navbar-sub {
  font-size: 14px;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  text-decoration: none;
}
.navbar-sub:hover { color: var(--text-head); }

/* ── iframe 樣式（無邊框、自動寬、高度由 JS 動態設定）── */
.content-frame {
  display: block;
  width: 100%;
  border: none;
  overflow: hidden;
  min-height: 600px;
}

/* ── Footer ── */
.site-footer {
  margin-top: 60px;
  padding-top: 20px;
  border-top: 0.5px solid var(--rule-light);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 14px;
  color: var(--text-hint);
  letter-spacing: 0.06em;
  padding-bottom: 40px;
}
.site-footer a {
  color: var(--text-hint);
  text-decoration: none;
  transition: color var(--transition);
}
.site-footer a:hover { color: var(--text-head); }

@media (max-width: 600px) {
  .shell { padding: 0 20px; }
}
</style>
</head>
<body>

<!-- ─── NAVBAR（誠品頂部導覽列）─── -->
<div class="shell">
  <nav class="navbar">
    <div class="navbar-left">
      <a class="navbar-brand" href="https://www.eslite.com/">誠品線上</a>
      <span class="navbar-divider"></span>
      <a class="navbar-sub" href="https://cwgvjessie.github.io/cwgv/2026-eslite-radar/eslite.html">職場雷達</a> 假設這是誠品iframe
    </div>
  </nav>
</div>

<!-- ─── 開發說明標示（測試用，可移除）─── -->
<div style="text-align: center;">
  <P> ↓ ↓ 內嵌  GVM GTM中介頁  https://event.gvm.com.tw/ddc_test/0Jessie/2026-eslite-radar/gvm-aigc.html" <p>
</div>

<!-- ─── IFRAME 內嵌區塊：gvm-aigc.html（遠見 GTM 中介頁，Layer 2）─── -->
<!-- src 不含 ?partner=，由下方 JS 動態帶入，確保 partner_site 永遠有值 -->
<iframe
  id="contentFrame"
  class="content-frame"
  src="https://event.gvm.com.tw/ddc_test/0Jessie/2026-eslite-radar/gvm-aigc.html"
  scrolling="no"
  title="深度解析內容"
></iframe>

<!-- ─── Script：動態將 partner 參數附加至 iframe src ─── -->
<!-- 邏輯：優先讀本頁 URL 的 ?partner= 參數（社群推播手動指定時使用）；
     沒有則自動抓目前頁面 hostname（例如 cwgvjessie.github.io）。
     這樣不管是誠品或未來其他合作夥伴，src 不需手動維護。-->
<script>
(function () {
  var iframe = document.getElementById('contentFrame');
  var urlParams = new URLSearchParams(window.location.search);
  // 優先用 URL 帶的 ?partner=，否則自動抓 hostname
  var partner = urlParams.get('partner') || window.location.hostname;
  var base = iframe.getAttribute('src');
  // 避免重複附加（src 已含 partner= 時不再處理）
  if (base.indexOf('partner=') === -1) {
    iframe.src = base + (base.indexOf('?') > -1 ? '&' : '?') + 'partner=' + encodeURIComponent(partner);
  }
})();
</script>

<!-- ─── FOOTER（誠品底部版權列）─── -->
<div class="shell">
  <footer class="site-footer">
    <span>© 2026 <a href="https://www.eslite.com/" target="_blank">誠品線上 eslite.com</a></span>
    <a href="https://cwgvjessie.github.io/cwgv/2026-eslite-radar/eslite.html">職場雷達</a>
  </footer>
</div>

<!-- ─── Script：接收 gvm-aigc.html 中繼轉發的 iframeHeight，自動撐高 #contentFrame ─── -->
<script>
window.addEventListener('message', function (e) {
  // 接收 iframeHeight（由 gvm-aigc.html 從 aigc.html 中繼轉發）
  if (e.data && typeof e.data.iframeHeight === 'number') {
    document.getElementById('contentFrame').style.height = e.data.iframeHeight + 'px';
  }
});
</script>

</body>
</html>
