<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>職場雷達 — 誠品線上</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:ital,wght@0,300;0,400;0,500;0,600;0,700&family=Noto+Sans+TC:ital,wght@0,300;0,400;0,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
* { font-style: normal; font-synthesis: none; }

:root {
  --white: #FFFFFF;
  --off-white: #F9F7F4;
  --rule-light: #E8E4DC;
  --rule: #D4CEC4;
  --text-hint: #AFA9A0;
  --text-muted: #847E76;
  --text-body: #3D3830;
  --text-head: #1A1710;
  --transition: 0.2s ease;
}

body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--white);
  color: var(--text-body);
  -webkit-font-smoothing: antialiased;
}

.shell {
  max-width: 800px;
  margin: 0 auto;
  padding: 0 32px;
}

/* ── Navbar ── */
.navbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 52px;
  border-bottom: 1px solid var(--text-head);
}
.navbar-left { display: flex; align-items: center; gap: 20px; }
.navbar-brand {
  font-family: 'EB Garamond', serif;
  font-size: 14px;
  letter-spacing: 0.14em;
  color: var(--text-head);
  text-transform: uppercase;
  text-decoration: none;
}
.navbar-divider { width: 1px; height: 12px; background: var(--rule); }
.navbar-sub {
  font-size: 14px;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  text-decoration: none;
}
.navbar-sub:hover { color: var(--text-head); }

/* ── iframe ── */
.content-frame {
  display: block;
  width: 100%;
  border: none;
  overflow: hidden;
}

/* ── Footer ── */
.site-footer {
  margin-top: 60px;
  padding-top: 20px;
  border-top: 0.5px solid var(--rule-light);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 14px;
  color: var(--text-hint);
  letter-spacing: 0.06em;
  padding-bottom: 40px;
}
.site-footer a {
  color: var(--text-hint);
  text-decoration: none;
  transition: color var(--transition);
}
.site-footer a:hover { color: var(--text-head); }

@media (max-width: 600px) {
  .shell { padding: 0 20px; }
}
</style>
</head>
<body>

<div class="shell">
  <nav class="navbar">
    <div class="navbar-left">
      <a class="navbar-brand" href="https://www.eslite.com/">誠品線上</a>
      <span class="navbar-divider"></span>
      <a class="navbar-sub" href="https://cwgvjessie.github.io/cwgv/2026-eslite-radar/eslite.html">職場雷達</a>
    </div>
  </nav>
</div>
<div style="text-align: center;">
  <P> ↓ ↓  內嵌遠見iframe  "https://event.gvm.com.tw/ddc_test/0Jessie/2026-eslite-radar/eslite-article-main.html" <p>
</div>
<iframe
  id="contentFrame"
  class="content-frame"
  src="https://event.gvm.com.tw/ddc_test/0Jessie/2026-eslite-radar/eslite-article-main.html"
  scrolling="no"
  title="職場雷達內容"
></iframe>

<div class="shell">
  <footer class="site-footer">
    <span>© 2026 <a href="https://www.eslite.com/" target="_blank">誠品線上 eslite.com</a></span>
    <a href="https://cwgvjessie.github.io/cwgv/2026-eslite-radar/eslite.html">職場雷達</a>
  </footer>
</div>

<script>
window.addEventListener('message', function (e) {
  if (e.data && typeof e.data.iframeHeight === 'number') {
    document.getElementById('contentFrame').style.height = e.data.iframeHeight + 'px';
  }
});
</script>

</body>
</html>
