name: Gemini Auto Dev Workflow

on:
  issues:
    types:
      - labeled

jobs:
  gemini-dev:
    if: github.event.label.name == 'ai-dev'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Google GenAI SDK
        run: npm install @google/genai

      - name: Run Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}

        run: |
          BRANCH_NAME="feature/issue-$ISSUE_NUMBER"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b $BRANCH_NAME || git checkout $BRANCH_NAME

          cat > runner.js <<'EOF'
          const { GoogleGenAI } = require("@google/genai");
          const fs = require("fs");

          const apiKey = process.env.GEMINI_API_KEY;

          if (!apiKey) {
            console.error("❌ GEMINI_API_KEY 未設定");
            process.exit(1);
          }

          console.log("✅ API Key 已讀取");

          const ai = new GoogleGenAI({
            apiKey
          });

          async function run() {

            const title = process.env.ISSUE_TITLE || "";
            const body = process.env.ISSUE_BODY || "";

            console.log("Issue Title:", title);

            const prompt =
              "你是一位資深軟體工程師。\n\n" +
              "根據以下 GitHub Issue 產生 JSON。\n\n" +
              "Issue Title:\n" +
              title +
              "\n\nIssue Body:\n" +
              body +
              "\n\n請只輸出 JSON。\n\n" +
              '{"filename":"hello.txt","content":"Hello CWGV"}';

            const response =
              await ai.models.generateContent({
                model: "gemini-2.5-flash",
                contents: prompt
              });

            const text =
              response.text
                .replace(/```json/g, "")
                .replace(/```/g, "")
                .trim();

            console.log("Gemini 回應：");
            console.log(text);

            const result = JSON.parse(text);

            fs.writeFileSync(
              result.filename,
              result.content
            );

            console.log(
              `✅ 已建立檔案 ${result.filename}`
            );
          }

          run().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          EOF

          node runner.js

          git add .

          if git diff --cached --quiet; then
            echo "沒有變更"
            exit 0
          fi

          git commit -m "feat: Gemini issue #${ISSUE_NUMBER}"

          git push origin $BRANCH_NAME

      - name: 
