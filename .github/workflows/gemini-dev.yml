name: Gemini Auto Dev Workflow

on:
  issues:
    types: [labeled]

jobs:
  gemini-dev:
    if: github.event.label.name == 'ai-dev'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Google Gen AI SDK
        run: |
          npm install @google/genai

      - name: Run Gemini to Process Issue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH_NAME="feature/issue-$ISSUE_NUMBER"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b $BRANCH_NAME || git checkout $BRANCH_NAME

          cat << 'EOF' > runner.js
          const { GoogleGenAI } = require("@google/genai");
          const fs = require("fs");

          const apiKey = process.env.GEMINI_API_KEY;
          if (!apiKey) {
            console.error("❌ 錯誤：未讀取到 GEMINI_API_KEY Secrets");
            process.exit(1);
          }

          const ai = new GoogleGenAI({ apiKey });

          async function run() {
            const title = process.env.ISSUE_TITLE || "";
            const body = process.env.ISSUE_BODY || "";

            const prompt = `你是一位自動化開發工程師。請根據以下 Issue 需求，輸出要新增或修改的檔案路徑與內容。
          標題: ${title}
          內容: ${body}

          請嚴格僅輸出標準 JSON 格式（不要包含任何 Markdown 標記，如 \`\`\`json）：
          {"filename": "hello.txt", "content": "Hello from Gemini API!"}`;

            console.log("🚀 正在送出請求至 Gemini API (gemini-2.0-flash)...");
            
            // 使用支援免費層級額度的 gemini-2.0-flash
            const response = await ai.models.generateContent({
              model: "gemini-2.0-flash",
              contents: prompt,
            });

            console.log("📝 Gemini 回應內容：\n", response.text);

            try {
              const cleanText = response.text.replace(/```json|```/g, "").trim();
              const result = JSON.parse(cleanText);
              fs.writeFileSync(result.filename, result.content);
              console.log(`✅ 成功寫入檔案: ${result.filename}`);
            } catch (e) {
              console.error("解析 JSON 失敗：", e.message);
              process.exit(1);
            }
          }

          run().catch(err => {
            console.error("執行過程發生異常：", err);
            process.exit(1);
          });
          EOF

          node runner.js
          rm runner.js

          git add .
          git commit -m "feat: auto resolution for Issue #${ISSUE_NUMBER} by Gemini"
          git push origin $BRANCH_NAME

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH_NAME="feature/issue-$ISSUE_NUMBER"
          gh pr create \
            --title "Fix/Feat: Issue #${ISSUE_NUMBER} (Gemini Generated)" \
            --body "此 PR 由 Gemini 自動生成，回應 Issue #${ISSUE_NUMBER}。" \
            --base main \
            --head $BRANCH_NAME
